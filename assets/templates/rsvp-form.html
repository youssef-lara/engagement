<form class="rsvp-form" data-rsvp-form method="post" accept-charset="UTF-8" aria-describedby="rsvp-form-status">
              <fieldset data-rsvp-fields disabled>
                <legend class="visually-hidden">RSVP details</legend>
                <p class="rsvp-form__field"><label for="full-name">Full name</label><input id="full-name" name="name" type="text" autocomplete="name" minlength="2" maxlength="100" required></p>
                <fieldset class="rsvp-form__options">
                  <legend>Will you attend?</legend>
                  <div class="rsvp-form__pills">
                  <label class="rsvp-form__choice"><input name="attendance" type="radio" value="Attending" required><span>Joyfully attending</span></label>
                  <label class="rsvp-form__choice"><input name="attendance" type="radio" value="Not attending"><span>Unable to attend</span></label>
                </fieldset>
                <p class="rsvp-form__field"><label for="message">Optional note</label><textarea id="message" name="message" maxlength="500"></textarea></p>
                <p class="rsvp-form__guard" aria-hidden="true"><label for="website">Website</label><input id="website" name="_honey" type="text" autocomplete="off" tabindex="-1"></p>
                <input name="language" type="hidden" value="en">
                <input name="submitted_at" type="hidden">
                <input name="page_url" type="hidden">
                <input name="submission_id" type="hidden">
                <button class="button" type="submit" data-rsvp-submit disabled>Submit RSVP</button>
              </fieldset>
              <p class="rsvp-form__status" id="rsvp-form-status" data-rsvp-status role="status" aria-live="polite">Preparing the reply form…</p>
              <p class="rsvp-form__backup" data-rsvp-backup hidden>Until online replies are connected, please <a href="https://forms.gle/daqf2ug4TypLtKwH8" rel="external" target="_blank">use the RSVP form</a>.</p>
              <noscript><p class="rsvp-form__backup">JavaScript is required for on-page replies. Please <a href="https://forms.gle/daqf2ug4TypLtKwH8" rel="external" target="_blank">use the RSVP form</a>.</p></noscript>
            </form>
